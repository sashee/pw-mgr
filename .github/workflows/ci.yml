name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here needs to write to the repo.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Don't leave a token in .git; nothing here pushes.
          persist-credentials: false

      - name: Reclaim disk space
        run: |
          # Delete preinstalled toolchains this repo never uses (~25-30 GB on root); Chromium's and the Rust
          # build's closures need the room. || true so a path missing on one image is not fatal.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7

      # Both packages and every check, in the Nix sandbox: e2ee-store's Rust suite (in the backend's build), the
      # frontend's unit tests (including the KeePass import against pykeepass's sample databases), the browser
      # tests (Chromium with a PRF-capable virtual authenticator), the NixOS module in a VM, and the e2ee-store
      # checks this repository reruns. The same as `make check` locally.
      - name: Build and test
        run: make check
